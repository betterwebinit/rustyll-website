<div class="terminal-window"><div class="terminal-title">{{ include.title | default: 'Terminal' }}</div><div class="terminal-commands">{% for command in include.commands %}<div class="command-row"><span aria-hidden="true">$</span><code>{{ command | escape }}</code><button class="copy-button" type="button" data-copy="{{ command | escape }}">Copy</button></div>{% endfor %}</div></div>
