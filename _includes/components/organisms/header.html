<header class="site-header" id="site-header">
  <div class="container header-inner">
    {% include components/atoms/logo.html %}
    <nav class="desktop-nav" aria-label="Main navigation">
      {% for item in site.data.primary_nav %}<a href="{{ item.link | relative_url }}" {% if page.url == item.link or item.link != '/' and page.url contains item.link %}aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
    </nav>
    <div class="header-actions"><a href="{{ '/search/' | relative_url }}" class="search-trigger" data-search-open aria-label="Search documentation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Search</span><kbd>⌘ K</kbd></a><a class="header-github" href="{{ site.repository }}">GitHub <span aria-hidden="true">↗</span></a></div>
    <button type="button" class="menu-toggle" id="mobile-menu-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu"><span>Menu</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" hidden><div class="container">{% for item in site.data.primary_nav %}<a href="{{ item.link | relative_url }}" {% if page.url == item.link %}aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}<a href="{{ '/search/' | relative_url }}" data-search-open>Search documentation</a><a href="{{ site.repository }}">GitHub ↗</a></div></nav>
  <noscript><nav class="no-js-nav container" aria-label="Navigation">{% for item in site.data.primary_nav %}<a href="{{ item.link | relative_url }}">{{ item.title }}</a>{% endfor %}</nav></noscript>
</header>
