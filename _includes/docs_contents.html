<nav class="docs-links" aria-label="Documentation sections">{% for section in site.data.docs_nav %}<h2>{{ section.title }}</h2><ul>{% for item in section.docs %}{% assign item_page = site.docs | where: 'url', item.link | first %}{% if item_page %}<li><a href="{{ item_page.url | relative_url }}" {% if item_page.url == page.url %}aria-current="page"{% endif %}>{{ item_page.menu_name | default: item_page.title }}</a></li>{% endif %}{% endfor %}</ul>{% endfor %}</nav>
